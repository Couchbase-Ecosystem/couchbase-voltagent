name: Live Couchbase integration

# Runs the live integration tests and the customer-support example against a throwaway Couchbase
# Server 8 container on every PR that can change their outcome, nightly, and on demand.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/examples/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsup.config.ts'
      - 'vitest.integration.config.ts'
      - '.github/workflows/live-integration.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  couchbase-server-8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration:docker
      # Use a fresh container so back-to-back vector-index builds do not contend on the small CI node.
      - run: npm run example:customer-support:docker
