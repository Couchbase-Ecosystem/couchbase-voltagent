name: Publish npm package

# Publishes @couchbase-ecosystem/voltagent to npm when a v* tag is pushed, then publishes the draft
# GitHub release kept up to date by draft-release.yml. The full checklist is in docs/RELEASING.md.
#
# npm trusted publishing is configured for this exact filename and the `npm` environment. Renaming
# either breaks publishing until the trusted publisher on npmjs.com is updated.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to publish from; defaults to current ref'
        required: false
        type: string
      dry_run:
        description: 'Run every check and npm publish --dry-run, but do not publish'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # npm trusted publishing (OIDC) and provenance.
  id-token: write

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish npm package
    if: github.repository == 'Couchbase-Ecosystem/couchbase-voltagent'
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "::error::Tag '${RELEASE_TAG}' does not match package.json version ${version} (expected v${version})"
            exit 1
          fi
      - name: Check the version is not already on npm
        env:
          PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Publishing is irreversible and npm rejects a repeat, so stop before the long checks.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            if [[ "$PUBLISH" == "true" ]]; then
              echo "::error::${name}@${version} is already published; bump the version in package.json"
              exit 1
            fi
            echo "::warning::${name}@${version} is already published; continuing because this is a dry run"
            echo "ALREADY_ON_NPM=true" >> "$GITHUB_ENV"
          fi
      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)" \
            || npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:integration:docker
      - run: npm pack --dry-run
      - run: npx attw --pack
      - name: Choose the npm dist-tag
        # A prerelease such as 0.2.0-rc.1 must never become the `latest` that users install.
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then echo "NPM_DIST_TAG=next"; else echo "NPM_DIST_TAG=latest"; fi >> "$GITHUB_ENV"
      - name: Publish dry run
        # npm 11 refuses even a dry run over an existing version; npm pack --dry-run above covers it.
        if: env.ALREADY_ON_NPM != 'true'
        run: npm publish --dry-run --access public --tag "$NPM_DIST_TAG"
      - name: Publish to npm with provenance
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

  github-release:
    name: Publish the GitHub release
    needs: publish
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Publish the draft, or create the release if there is none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)

          # draft-release.yml keeps a draft for this version up to date on every merge. Publish
          # that draft rather than regenerating it, so edits made by hand survive.
          state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [[ "$state" == "true" ]]; then
            echo "Publishing the existing draft for $RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --draft=false --tag "$RELEASE_TAG" ${prerelease[@]+"${prerelease[@]}"}
          elif [[ "$state" == "false" ]]; then
            echo "::notice::$RELEASE_TAG is already published; nothing to do"
          else
            echo "No draft found for $RELEASE_TAG; generating notes now"
            scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              ${prerelease[@]+"${prerelease[@]}"}
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
