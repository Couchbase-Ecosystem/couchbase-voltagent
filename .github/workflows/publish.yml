name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'Couchbase-Ecosystem/couchbase-voltagent'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:integration:docker
      - run: npm pack --dry-run
      - run: npx attw --pack
      - name: Verify release tag matches package version
        id: release
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${package_version}" == *-* ]]; then
            echo "tag=next" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
          fi
      - name: Check whether this immutable version already exists
        id: registry
        run: |
          if npm view "@couchbase/voltagent@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish package
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.tag }}"
      - name: Report an already-published bootstrap version
        if: steps.registry.outputs.exists == 'true'
        run: echo "@couchbase/voltagent@${{ steps.release.outputs.version }} already exists; keeping the GitHub Release without republishing it."
