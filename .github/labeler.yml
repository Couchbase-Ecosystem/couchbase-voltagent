# Path-based half of the PR labelling in .github/workflows/label-pull-requests.yml.
# The labels are documented in docs/CONTRIBUTING.md and grouped into release notes by
# .github/release.yml.
#
# Only rules that are true by construction belong here. A path can prove a PR touched the tests;
# it cannot prove a change to src/ is a feature rather than a fix, so `enhancement` and `bug` come
# from the conventional-commit title (or a human).
#
# Labels are added, never removed (`sync-labels: false`), so a maintainer's correction sticks.

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - 'vitest.config.ts'
          - 'vitest.integration.config.ts'
          - 'scripts/run-integration-tests.sh'
          - 'scripts/with-couchbase-docker.sh'
